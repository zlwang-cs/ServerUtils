# ---- 你的原有前缀和按键，保留 ----
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind \\ split-window -h
bind - split-window -v
unbind '"'
unbind %

bind r source-file ~/.tmux.conf

bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ---- 鼠标 & 复制模式 ----
set -g mouse on
setw -g mode-keys vi

# y：复制到系统剪贴板（用 OSC52，SSH 远程 -> 本地Mac也能进剪贴板）
# 进入复制模式：Ctrl-a [
# 选择：v / V / Ctrl-v（可选）
# 复制：y
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "bash -lc 'b64=\$(base64 | tr -d \"\n\"); printf \"\033]52;c;%s\007\" \"\$b64\"'"

# （可选）prefix + m：快速开/关鼠标，想用原生拖选时很方便
bind m setw -g mouse \; display-message 'mouse: #{?mouse,on,off}'

# ---- 终端与颜色（更通用/好看）----
set -g default-terminal "xterm-256color"
set -as terminal-overrides ',*:Tc'
